[project]
name = "agno-learn"
version = "0.1.0"
description = "A staged Agno learning repository with examples, reusable helpers, and project notes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agno",
  "openai",
  "python-dotenv",
]

[project.optional-dependencies]
agentos = [
  "agno[os]",
]
knowledge = [
  "chromadb",
]
dev = [
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
