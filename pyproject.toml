[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscope-learn"
version = "0.1.0"
description = "A staged learning repository for AgentScope 2.x."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "agentscope>=2.0.3",
    "pydantic>=2.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
rag = [
    "agentscope[rag]>=2.0.3",
]
full = [
    "agentscope[full]>=2.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
